[package]
name = "fluxel-rhi"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Fluxel's statically dispatched RHI facade"
repository = "https://github.com/fluxel-project/fluxel-rhi"

[features]
# Cargo cannot select a default feature by target. Browser callers explicitly
# enable `webgpu`; Windows callers may also explicitly select `vulkan`.
default = ["dx12"]
dx12 = ["dep:fluxel-rhi-dx12"]
vulkan = ["dep:fluxel-rhi-vulkan"]
webgpu = ["dep:fluxel-rhi-webgpu"]
native-gl-wgl = ["dep:fluxel-rhi-gl", "fluxel-rhi-gl/native-gl-wgl"]
native-gles-egl = ["dep:fluxel-rhi-gl", "fluxel-rhi-gl/native-gles-egl"]
webgl2 = ["dep:fluxel-rhi-gl", "fluxel-rhi-gl/webgl2"]
examples = []

[dependencies]
fluxel-rhi-core = { path = "../core", default-features = false }
base64 = "0.22"
serde_json = "1"
png = "0.17"
fluxel-rhi-vulkan = { path = "../vulkan", optional = true }
fluxel-rhi-gl = { path = "../gl", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
fluxel-rhi-webgpu = { path = "../webgpu", optional = true }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Performance"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(windows)'.dependencies]
fluxel-rhi-dx12 = { path = "../dx12", optional = true }
fluxel-host = { git = "https://github.com/fluxel-project/fluxel-host", rev = "34616e7258830b7e52be5d7bd7a793629bbbf07b", features = ["winit-runtime"] }
raw-window-handle = "=0.6.2"

[[example]]
name = "01_triangle"
path = "examples/01_triangle/main.rs"
required-features = ["examples"]

