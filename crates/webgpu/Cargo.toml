[package]
name = "fluxel-rhi-webgpu"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Browser WebGPU backend for Fluxel RHI"
repository = "https://github.com/fluxel-project/fluxel-rhi"

[dependencies]
fluxel-rhi-core = { path = "../core" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
naga = { version = "27", features = ["spv-in", "wgsl-out"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement", "Window", "Document"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
