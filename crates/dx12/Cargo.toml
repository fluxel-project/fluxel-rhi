[package]
name = "fluxel-rhi-dx12"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Direct3D 12 backend for Fluxel RHI"
repository = "https://github.com/fluxel-project/fluxel-rhi"
readme = "README.md"
documentation = "https://docs.rs/fluxel-rhi-dx12"
keywords = ["gpu", "graphics", "direct3d12", "rhi", "backend"]
categories = ["graphics"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = []

[features]
# Real-device conformance requires a functioning DXGI/D3D12 driver. Keep the
# fixture opt-in so portable lowering unit tests remain runnable on every
# Windows development host.
hardware-tests = []

[dependencies]
fluxel-rhi-core = { path = "../core", version = "0.16.0" }
raw-window-handle = "=0.6.2"
# The checked-in HLSL patch handles storage descriptor arrays. Other backends
# retain their existing registry dependency and compiler route.
naga = { path = "../../vendor/naga", version = "=27.0.3", features = ["wgsl-in", "hlsl-out"] }

[dev-dependencies]
fluxel-host = { git = "https://github.com/fluxel-project/fluxel-host", rev = "b310f3fac4b8319343ef13341cd284344343c2ac", features = ["winit-runtime"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D_Dxc",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Direct3D12",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }

[[test]]
name = "mrt_gpu"
path = "tests/mrt_gpu/mod.rs"

[[test]]
name = "readonly_depth_stencil_gpu"
path = "tests/readonly_depth_stencil_gpu/mod.rs"
