[package]
name = "fluxel-rhi-dx12"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Direct3D 12 backend for Fluxel RHI"
repository = "https://github.com/fluxel-project/fluxel-rhi"

[features]
# Real-device conformance requires a functioning DXGI/D3D12 driver. Keep the
# fixture opt-in so portable lowering unit tests remain runnable on every
# Windows development host.
hardware-tests = []

[dependencies]
fluxel-rhi-core = { path = "../core", features = ["dx12"] }
raw-window-handle = "=0.6.2"

[dev-dependencies]
fluxel-host = { git = "https://github.com/fluxel-project/fluxel-host", rev = "34616e7258830b7e52be5d7bd7a793629bbbf07b", features = ["winit-runtime"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D12",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Security",
] }
