[package]
name = "fluxel-rhi-vulkan"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Vulkan backend for Fluxel RHI"
repository = "https://github.com/fluxel-project/fluxel-rhi"

[features]
hardware-tests = []

[dependencies]
ash = "=0.38.0"
fluxel-rhi-core = { path = "../core" }
raw-window-handle = "=0.6.2"
naga = { version = "=27.0.3", features = ["wgsl-in", "spv-out"] }

[[test]]
name = "hardware"
path = "tests/hardware/mod.rs"

[[test]]
name = "mrt_gpu"
path = "tests/mrt_gpu/mod.rs"

[[test]]
name = "readonly_depth_stencil_gpu"
path = "tests/readonly_depth_stencil_gpu/mod.rs"
