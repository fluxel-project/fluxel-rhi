[package]
name = "fluxel-rhi-vulkan"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "Vulkan backend for Fluxel RHI"
repository = "https://github.com/fluxel-project/fluxel-rhi"
readme = "README.md"
documentation = "https://docs.rs/fluxel-rhi-vulkan"
keywords = ["gpu", "graphics", "vulkan", "rhi", "backend"]
categories = ["graphics"]

[features]
hardware-tests = []

[dependencies]
ash = "=0.38.0"
fluxel-rhi-core = { path = "../core", version = "0.16.0" }
raw-window-handle = "=0.6.2"
naga = { version = "=27.0.3", features = ["wgsl-in", "spv-out"] }

[[test]]
name = "hardware"
path = "tests/hardware/mod.rs"

[[test]]
name = "mrt_gpu"
path = "tests/mrt_gpu/mod.rs"

[[test]]
name = "readonly_depth_stencil_gpu"
path = "tests/readonly_depth_stencil_gpu/mod.rs"

[[test]]
name = "sampler_clamp_zero_gpu"
path = "tests/sampler_gpu/clamp_zero.rs"

[[test]]
name = "mesh_gpu"
path = "tests/mesh_gpu/mod.rs"

[[test]]
name = "clear_gpu"
path = "tests/clear_gpu/mod.rs"

[[test]]
name = "int64_atomic_add_gpu"
path = "tests/int64_atomic_gpu/mod.rs"

[[test]]
name = "sampler_layout_switch_gpu"
path = "tests/sampler_gpu/layout_switch.rs"

[[test]]
name = "sampler_runtime_mixed_gpu"
path = "tests/sampler_gpu/runtime_mixed.rs"

[[test]]
name = "wgsl_sampler_array_gpu"
path = "tests/sampler_gpu/wgsl_array.rs"
