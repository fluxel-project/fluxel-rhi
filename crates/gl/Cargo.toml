[package]
name = "fluxel-rhi-gl"
version.workspace = true
edition = "2024"
rust-version = "1.87"
license = "MIT OR Apache-2.0"
description = "OpenGL, OpenGL ES, and WebGL2 backend for Fluxel RHI"
repository = "https://github.com/fluxel-project/fluxel-rhi"
readme = "README.md"
documentation = "https://docs.rs/fluxel-rhi-gl"
keywords = ["gpu", "graphics", "opengl", "gles", "webgl"]
categories = ["graphics"]

[package.metadata.docs.rs]
default-target = "wasm32-unknown-unknown"
features = ["webgl2"]
targets = []

[features]
default = []
native-gl-wgl = ["dep:glow", "dep:glutin_wgl_sys", "dep:raw-window-handle", "dep:futures-timer"]
native-gles-egl = ["dep:glow", "dep:khronos-egl", "dep:raw-window-handle", "dep:futures-timer"]
webgl2 = ["dep:glow", "dep:js-sys", "dep:wasm-bindgen", "dep:web-sys"]
test-support = []

[dependencies]
fluxel-rhi-core = { path = "../core", version = "0.16.0" }
naga = { version = "=27.0.3", features = ["wgsl-in", "glsl-out"] }
glow = { version = "=0.18.0", optional = true }
raw-window-handle = { version = "=0.6.2", optional = true }

[dev-dependencies]
fluxel-host = { git = "https://github.com/fluxel-project/fluxel-host", rev = "b310f3fac4b8319343ef13341cd284344343c2ac", features = ["winit-runtime"] }
raw-window-handle = "=0.6.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
khronos-egl = { version = "=6.0.0", features = ["dynamic"], optional = true }
futures-timer = { version = "=3.0.4", optional = true }

[target.'cfg(windows)'.dependencies]
glutin_wgl_sys = { version = "=0.6.1", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { version = "=0.3.105", optional = true }
wasm-bindgen = { version = "=0.2.128", optional = true }
web-sys = { version = "=0.3.105", optional = true, features = [
    "Document",
    "HtmlCanvasElement",
    "Performance",
    "WebGl2RenderingContext",
    "WebGlActiveInfo",
    "WebGlBuffer",
    "WebGlContextAttributes",
    "WebGlContextEvent",
    "WebglLoseContext",
    "WebGlFramebuffer",
    "WebGlProgram",
    "WebGlQuery",
    "WebGlRenderbuffer",
    "WebGlSampler",
    "WebGlShader",
    "WebGlShaderPrecisionFormat",
    "WebGlSync",
    "WebGlTexture",
    "WebGlTransformFeedback",
    "WebGlUniformLocation",
    "WebGlVertexArrayObject",
    "Gpu",
    "Window",
    "console",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3.50"
wasm-bindgen-futures = "0.4.55"
